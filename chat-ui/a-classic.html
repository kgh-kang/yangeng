<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>모아 · 시안 A 클래식</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* 시안 A — Claude 클래식: 따뜻한 종이 톤, 세리프 인사말, 가운데 컴포저 → 대화 시작 시 하단 고정 */
:root {
  --bg: #faf9f5;
  --side: #f4f2ea;
  --surface: #ffffff;
  --line: #e6e3d8;
  --line-strong: #d6d2c4;
  --fg: #1f1e1c;
  --sub: #5c5a53;
  --muted: #8b887e;
  --accent: #c6613f;
  --accent-ink: #ffffff;
  --bubble: #efece2;
  --hover: rgba(31, 30, 28, .06);
  --shadow: 0 1px 2px rgba(31,30,28,.04), 0 4px 18px rgba(31,30,28,.06);
  --serif: "Noto Serif KR", "Iowan Old Style", Georgia, serif;
  --sans: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --side-w: 272px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #262624; --side: #1f1e1d; --surface: #30302e; --line: #3b3a36; --line-strong: #4a4943;
  --fg: #f2f0e8; --sub: #c3c0b6; --muted: #9a978d; --accent: #d97757; --accent-ink: #1f1e1d;
  --bubble: #161615; --hover: rgba(242,240,232,.07); --shadow: 0 1px 2px rgba(0,0,0,.2), 0 6px 22px rgba(0,0,0,.25);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #262624; --side: #1f1e1d; --surface: #30302e; --line: #3b3a36; --line-strong: #4a4943;
  --fg: #f2f0e8; --sub: #c3c0b6; --muted: #9a978d; --accent: #d97757; --accent-ink: #1f1e1d;
  --bubble: #161615; --hover: rgba(242,240,232,.07); --shadow: 0 1px 2px rgba(0,0,0,.2), 0 6px 22px rgba(0,0,0,.25);
  color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.icon-btn { width: 34px; height: 34px; display: inline-grid; place-items: center; border-radius: 8px; color: var(--sub); }
.icon-btn:hover { background: var(--hover); color: var(--fg); }

/* ---------- 레이아웃 ---------- */
.app { display: grid; grid-template-columns: var(--side-w) 1fr; height: 100%; transition: grid-template-columns .22s ease; }
.nav-collapsed .app { grid-template-columns: 0 1fr; }
.nav-collapsed .side { visibility: hidden; }

/* ---------- 사이드바 ---------- */
.side { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; overflow: hidden; padding: 10px; gap: 4px; }
.side__top { display: flex; align-items: center; justify-content: space-between; padding: 4px 4px 10px; }
.brand { display: flex; align-items: center; gap: 8px; font: 600 19px/1 var(--serif); letter-spacing: -.01em; }
.brand svg { color: var(--accent); }
.side__btn { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--fg); text-align: left; font-size: 14px; }
.side__btn:hover { background: var(--hover); }
.side__btn--new .plus { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.side__btn--new { font-weight: 500; color: var(--accent); }
.side__label { font-size: 12px; color: var(--muted); padding: 16px 10px 6px; letter-spacing: .02em; }
.recents { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
.recents a { display: block; padding: 7px 10px; border-radius: 8px; color: var(--sub); text-decoration: none; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.recents a:hover { background: var(--hover); color: var(--fg); }
.recents a.is-active { background: var(--hover); color: var(--fg); font-weight: 500; }
.profile { display: flex; align-items: center; gap: 10px; padding: 10px; border-top: 1px solid var(--line); margin: 6px -10px -10px; padding-inline: 14px; }
.profile__av { width: 32px; height: 32px; border-radius: 50%; background: var(--fg); color: var(--bg); display: grid; place-items: center; font-weight: 600; font-size: 13px; }
.profile__name { font-size: 14px; font-weight: 500; line-height: 1.2; }
.profile__plan { font-size: 12px; color: var(--muted); }
.profile .icon-btn { margin-left: auto; }

/* ---------- 메인 ---------- */
.main { display: flex; flex-direction: column; min-width: 0; height: 100%; position: relative; }
.topbar { display: flex; align-items: center; gap: 6px; padding: 10px 14px; padding-top: max(10px, env(safe-area-inset-top)); }
.topbar__title { font-size: 14px; color: var(--sub); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.is-empty .topbar__title { visibility: hidden; }
.share { padding: 6px 12px; border: 1px solid var(--line-strong); border-radius: 8px; font-size: 13px; }
.share:hover { background: var(--hover); }

.scroll { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
.thread { max-width: 760px; margin: 0 auto; padding: 8px 20px 40px; display: flex; flex-direction: column; gap: 28px; }

/* 빈 상태: 인사말 + 가운데 컴포저 */
.welcome { display: none; text-align: center; padding: 0 20px 26px; }
.welcome h1 { font: 400 clamp(28px, 4.2vw, 40px)/1.25 var(--serif); letter-spacing: -.02em; margin: 0; display: inline-flex; align-items: center; gap: 14px; text-wrap: balance; }
.welcome h1 svg { color: var(--accent); flex: none; }
.is-empty .main { justify-content: center; }
.is-empty .scroll { display: none; }
.is-empty .welcome { display: block; }
.is-empty .topbar { position: absolute; inset: 0 0 auto 0; }
.is-empty .dock { padding-bottom: 12vh; }
.chips { display: none; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.is-empty .chips { display: flex; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 7px 13px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); font-size: 14px; color: var(--sub); }
.chip:hover { background: var(--surface); color: var(--fg); border-color: var(--line-strong); }

/* ---------- 컴포저 ---------- */
.dock { padding: 0 20px 18px; padding-bottom: max(18px, env(safe-area-inset-bottom)); }
.composer { max-width: 760px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); padding: 14px 14px 10px 18px; transition: border-color .15s; }
.composer:focus-within { border-color: var(--line-strong); }
.composer textarea { width: 100%; border: 0; outline: 0; resize: none; background: transparent; color: var(--fg); font: 16px/1.55 var(--sans); min-height: 28px; max-height: 240px; padding: 0; }
.composer textarea::placeholder { color: var(--muted); }
.composer__row { display: flex; align-items: center; gap: 4px; margin-top: 10px; margin-left: -6px; }
.tool { height: 32px; min-width: 32px; padding: 0 8px; border: 1px solid var(--line); border-radius: 8px; display: inline-flex; align-items: center; gap: 6px; color: var(--sub); font-size: 13px; }
.tool:hover { background: var(--hover); color: var(--fg); }
.spacer { flex: 1; }
.model { position: relative; }
.model__btn { display: inline-flex; align-items: center; gap: 4px; padding: 6px 8px; border-radius: 8px; font-size: 13px; color: var(--sub); }
.model__btn:hover { background: var(--hover); }
.pop { position: absolute; right: 0; bottom: calc(100% + 8px); width: 260px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; z-index: 20; }
.pop button { width: 100%; text-align: left; padding: 8px 10px; border-radius: 8px; display: grid; grid-template-columns: 1fr auto; gap: 0 8px; }
.pop button:hover { background: var(--hover); }
.pop b { font-weight: 500; font-size: 14px; }
.pop small { grid-column: 1; color: var(--muted); font-size: 12px; }
.pop button[aria-checked="true"]::after { content: "✓"; grid-row: 1 / span 2; grid-column: 2; align-self: center; color: var(--accent); }
.send { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; transition: opacity .15s, transform .1s; }
.send:disabled { opacity: .4; cursor: default; }
.send:not(:disabled):active { transform: scale(.94); }
.send .i-stop { display: none; }
.is-busy .send .i-up { display: none; }
.is-busy .send .i-stop { display: block; }
.disclaimer { text-align: center; font-size: 12px; color: var(--muted); margin: 8px 0 0; }
.is-empty .disclaimer { display: none; }

/* ---------- 메시지 ---------- */
.msg { display: flex; gap: 12px; min-width: 0; }
.msg__content { min-width: 0; flex: 1; }
.msg--user { align-self: flex-start; background: var(--bubble); border-radius: 14px; padding: 10px 16px 10px 10px; max-width: 85%; }
.msg--user .msg__avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--fg); color: var(--bg); display: grid; place-items: center; font-size: 12px; font-weight: 600; flex: none; }
.msg--user .msg__body p { margin: 2px 0; }
.msg--ai .msg__avatar { display: none; }
.msg--ai .msg__body { font: 16.5px/1.75 var(--serif); }
.msg__body > :first-child { margin-top: 0; }
.msg__body p { margin: 0 0 14px; }
.msg__body h3 { font: 600 17px/1.4 var(--sans); margin: 22px 0 8px; }
.msg__body ul, .msg__body ol { margin: 0 0 14px; padding-left: 22px; }
.msg__body li { margin: 4px 0; }
.msg__body code { font: 13.5px var(--mono); background: var(--bubble); padding: 2px 5px; border-radius: 5px; }
.codeblock { margin: 0 0 14px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--side); }
.codeblock__head { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; font: 12px var(--sans); color: var(--muted); border-bottom: 1px solid var(--line); }
.codeblock__copy { font-size: 12px; color: var(--sub); padding: 2px 6px; border-radius: 6px; }
.codeblock__copy:hover { background: var(--hover); }
.codeblock code { display: block; padding: 14px; overflow-x: auto; background: none; font-size: 13px; line-height: 1.6; white-space: pre; }
.msg__actions { display: flex; gap: 2px; margin-top: 2px; margin-left: -6px; opacity: 0; transition: opacity .15s; }
.msg--ai:hover .msg__actions, .msg--ai:last-child .msg__actions { opacity: 1; }
.is-streaming .msg__actions { visibility: hidden; }
.msg__actions button { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 7px; color: var(--muted); }
.msg__actions button:hover { background: var(--hover); color: var(--fg); }
.msg__stopped { color: var(--muted); font: 14px var(--sans); }
.typing { display: inline-flex; gap: 5px; padding: 8px 0; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: blink 1.2s infinite ease-in-out; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; transform: scale(.85); } 40% { opacity: 1; transform: scale(1); } }

.scrim { display: none; }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .side { position: fixed; inset: 0 auto 0 0; width: min(86vw, 300px); z-index: 40; transform: translateX(-100%); transition: transform .22s ease; padding-top: max(10px, env(safe-area-inset-top)); }
  .nav-open .side { transform: none; }
  .scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 30; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .nav-open .scrim { opacity: 1; pointer-events: auto; }
  .dock, .thread { padding-inline: 16px; }
  .msg--user { max-width: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
.composer textarea:focus-visible { outline: none; box-shadow: none; }
</style>
</head>

<script>
  // 대화 시작 시 상단 제목 갱신
  document.addEventListener('chatshell:done', (e) => {
    const t = document.querySelector('.topbar__title');
    if (t.textContent === '새 대화') t.textContent = e.detail.prompt.slice(0, 40);
  });
  document.addEventListener('chatshell:new', () => (document.querySelector('.topbar__title').textContent = '새 대화'));
</script>
</body>
</html>
