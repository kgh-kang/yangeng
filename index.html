<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공학영어 문장 분석기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <!-- 헤더 -->
        <header class="header">
            <h1 class="logo" aria-label="공학영어 문장 분석기 — 강광현 제작">
                <svg class="logo-svg" viewBox="0 0 384 90" role="img" xmlns="http://www.w3.org/2000/svg">
                    <!-- 빨강 baseline -->
                    <line x1="8" y1="44" x2="376" y2="44" stroke="#C0504D" stroke-width="3" stroke-linecap="round"/>
                    <!-- 세로 구분선(십자) : 공학영어 | 문장 | 분석기 -->
                    <line x1="150" y1="22" x2="150" y2="58" stroke="#C0504D" stroke-width="3" stroke-linecap="round"/>
                    <line x1="238" y1="24" x2="238" y2="44" stroke="#C0504D" stroke-width="3" stroke-linecap="round"/>
                    <!-- 제목 분절 -->
                    <text x="79" y="36" text-anchor="middle" class="logo-seg">공학영어</text>
                    <text x="194" y="36" text-anchor="middle" class="logo-seg">문장</text>
                    <text x="307" y="36" text-anchor="middle" class="logo-seg">분석기</text>
                    <!-- 강광현 제작 : \ 사선으로 매달린 수식어 -->
                    <line x1="300" y1="50" x2="311" y2="62" stroke="#9a8f8a" stroke-width="2" stroke-linecap="round"/>
                    <text x="316" y="66" class="logo-by">강광현 제작</text>
                </svg>
            </h1>
        </header>

        <!-- 입력 -->
        <div class="input-area">
            <div class="input-wrap">
                <input
                    id="inp"
                    type="text"
                    placeholder="영어 문장을 입력하세요"
                    autocomplete="off"
                    spellcheck="false"
                    onkeydown="if(event.key==='Enter')go()"
                >
                <button class="btn-analyze" onclick="go()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                    <span>분석</span>
                </button>
            </div>
        </div>

        <!-- 최근 분석 (검색창 바로 아래) -->
        <div id="history-area"></div>

        <!-- 맞춤법/문법 체크 (결과 위) -->
        <div id="spell-area"></div>

        <!-- 결과 -->
        <div id="result" class="result-area">
            <div class="empty-state">
                <div class="empty-icon">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#d0d0d0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10,9 9,9 8,9"/></svg>
                </div>
                <p>문장을 입력하면 구조도가 여기에 표시됩니다</p>
            </div>
        </div>

    </div>

    <script src="https://unpkg.com/compromise"></script>
    <script src="parser.js"></script>
    <script src="renderer.js"></script>
    <script data-goatcounter="https://kgh-kang.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>
</body>
</html>
